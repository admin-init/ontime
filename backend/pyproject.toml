[project]
name = "ontime-backend"
version = "0.1.0"
description = "到点 · 多来源校园信息行动台（Demo）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pillow>=11.0",
    "icalendar>=6.1",
    "trafilatura>=1.12",
    "pypdf>=5.1",
    "apscheduler>=3.11.3",
    "imap-tools>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
